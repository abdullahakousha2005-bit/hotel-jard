:root{--bg:#eef2f4;--card:#fff;--ink:#0f2a33;--mut:#5d727a;--ac:#0e7c86;--bad:#b3402e;--ok:#2f7d4f;--ln:#d5dee2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.mut{color:var(--mut)}.s{font-size:13px}

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={hotels:[],users:[],items:[],recs:[]};
const uid=()=>Math.random().toString(36).slice(2,9);
const OPS={break:'كسر',count:'جرد',issue:'صرف'};
const STAT={pending:'منتظر الاعتماد',approved:'تم الاعتماد',mistake:'وقعت بالخطأ'};
const SECS=['عُهدة','شبت'];
const REASONS=['وقع أثناء الشغل','عيب في الصنف','غسيل','من العميل','أخرى'];
let rmo=(d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'))(new Date()),eh=null,lh=null,me=null,tab='',photo='',scanT=null,stream=null;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2600)}
const val=id=>($('#'+id)||{}).value||'';
const inMo=r=>{const d=new Date(r.ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')===rmo};
const fmt=t=>new Date(t).toLocaleString('ar-EG',{dateStyle:'short',timeStyle:'short'});
const money=n=>(Math.round(n*100)/100).toLocaleString('ar-EG');
const iname=id=>(S.items.find(i=>i.id===id)||{name:'(صنف محذوف)'}).name;

function render(){
  const a=$('#app');applyTheme(me?S.hotels.find(x=>x.id===me.hotel):(lh&&lh!=='owner'?lh:null));
  if(!me){a.innerHTML=`<div class="login">${lh&&lh.logo?`<img src="${lh.logo}" alt="" style="height:64px;border-radius:10px;margin-bottom:8px">`:''}<h1>جرد الفنادق</h1>${lh?`<p class="mut">الفندق: <b>${esc(lh==='owner'?'Abdullah':lh.name)}</b> <a href="#" onclick="lh=null;render();return false">تغيير</a></p>`:`<p class="mut">اكتب اسم الفندق</p><input id="hn2" placeholder="اسم الفندق"><button class="pri" onclick="nextStep()">التالي</button>`}<div ${lh?'':'hidden'}>
  <input id="u" placeholder="اسم المستخدم" autocomplete="username" ${lh==='owner'?'hidden':''}><input id="p" type="password" placeholder="كلمة السر" autocomplete="current-password">
  <button class="pri" onclick="login()">تسجيل الدخول</button><button class="sm" style="width:100%;margin-top:10px;padding:12px" onclick="scan(loginQR)">دخول بمسح QR</button></div></div>`;return}
  const h=S.hotels.find(x=>x.id===me.hotel);
  const tabs=me.role==='owner'?[['hot','الفنادق']]:me.role==='manager'?[['pend','الطلبات'],['items','الأصناف'],['staff','الكباتن'],['rep','التقارير']]:[['new','تسجيل جديد'],['mine','تسجيلاتي']];
  if(!tab||!tabs.some(t=>t[0]===tab))tab=tabs[0][0];
  a.innerHTML=`<header>${h&&h.logo?`<img src="${h.logo}" alt="" style="height:32px;border-radius:6px">`:''}<b>${esc(h?h.name:'لوحة المالك')}</b><span>${esc(me.name)}</span><button onclick="logout()">خروج</button></header>
  <nav>${tabs.map(t=>`<button class="${t[0]===tab?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('')}</nav><main>${VIEWS[tab]()}</main>`;
}
const mine=()=>S.recs.filter(r=>r.hotel===me.hotel);
const recCard=(r,act)=>{const u=S.users.find(u=>u.id===r.uid)||{name:r.un,emp:r.ue};const cost=r.op==='count'?'':` · ${money(r.p*r.qty)}`;
return `<div class="card"><div class="row"><b class="sp">${OPS[r.op]}: ${esc(iname(r.item))} × ${r.qty}${cost}</b><span class="tag ${r.status}">${STAT[r.status]}</span></div>
<div class="mut s">${esc(u.name||'')} ${u.emp?'('+esc(u.emp)+')':''} · ${fmt(r.ts)}${r.reason?' · '+esc(r.reason):''}${r.area?' · '+esc(r.area):''}${r.ex?Object.keys(r.ex).map(k=>' · '+esc(k)+': '+esc(r.ex[k])).join(''):''}</div>
<div class="row" style="margin-top:8px">${r.photo?`<img class="th" src="${r.photo}" alt="">`:''}<span class="sp"></span>${act&&r.status==='pending'?`<button class="sm ok" onclick="setSt('${r.id}','approved')">اعتماد</button><button class="sm bad" onclick="setSt('${r.id}','mistake')">وقعت بالخطأ</button>`:''}</div></div>`};
const VIEWS={
hot(){if(eh)return VIEWS.hotEdit();return `<div class="row" style="margin-bottom:12px"><button class="sm" onclick="chgOwner()">تغيير كلمة سر المالك</button></div><div class="card"><label>اسم الفندق</label><input id="hn"><label>اسم المدير</label><input id="mn"><label>اسم دخول المدير</label><input id="mu"><label>كلمة سر المدير</label><input id="mp">
<button class="pri" onclick="addHotel()">إضافة الفندق</button></div>`+
(S.hotels.length?S.hotels.map(h=>`<div class="card row"><b class="sp">${esc(h.name)}</b><span class="tag">${S.users.filter(u=>u.hotel===h.id).length} مستخدم</span><button class="sm" onclick="eh='${h.id}';render()">إعدادات</button><button class="sm ${h.active?'bad':'ok'}" onclick="togH('${h.id}')">${h.active?'إيقاف':'تفعيل'}</button></div>`).join(''):'<p class="mut">مفيش فنادق لسه. أضف أول فندق من فوق.</p>')},
pend(){const p=mine().filter(r=>r.status==='pending').sort((a,b)=>b.ts-a.ts);
return p.length?p.map(r=>recCard(r,true)).join(''):'<p class="mut">مفيش طلبات منتظرة.</p>'},
items(){return `<div class="card"><label>اسم الصنف</label><input id="in"><label>السعر</label><input id="ip" type="number" inputmode="decimal"><label>القسم</label><select id="is">${SECS.map(s=>`<option>${s}</option>`).join('')}</select>
<button class="pri" onclick="addItem()">إضافة الصنف</button></div>`+
S.items.filter(i=>i.hotel===me.hotel).map(i=>`<div class="card row"><div class="sp"><b>${esc(i.name)}</b><div class="mut s">${esc(i.sec)} · ${money(i.price)}</div></div><button class="sm" onclick="editPrice('${i.id}')">السعر</button><button class="sm bad" onclick="delItem('${i.id}')">حذف</button></div>`).join('')},
staff(){return `<div id="qrbox"></div><div class="card"><label>الاسم</label><input id="sn"><label>الرقم الوظيفي</label><input id="se"><label>اسم الدخول</label><input id="su"><label>كلمة السر</label><input id="sp">
<label>مسموح له يسجل</label><div class="row">${Object.keys(OPS).map(k=>`<label style="display:flex;gap:4px;align-items:center;margin:0 0 10px"><input type="checkbox" id="o_${k}" checked style="width:auto;margin:0">${OPS[k]}</label>`).join('')}</div>
<button class="pri" onclick="addStaff()">إضافة كابتن</button></div>`+
S.users.filter(u=>u.hotel===me.hotel&&u.role==='captain').map(u=>`<div class="card row"><div class="sp"><b>${esc(u.name)}</b><div class="mut s">${esc(u.emp)} · ${u.ops.map(o=>OPS[o]).join('، ')}</div></div><button class="sm" onclick="staffPw('${u.id}')">كلمة السر</button><button class="sm" onclick="showQR('${u.id}')">QR الدخول</button><button class="sm bad" onclick="delStaff('${u.id}')">حذف</button></div>`).join('')},
rep(){const mr=mine().filter(inMo),ap=mr.filter(r=>r.status==='approved');const by=(op)=>{const m={};ap.filter(r=>r.op===op).forEach(r=>{m[r.item]=m[r.item]||{q:0,c:0};m[r.item].q+=r.qty;m[r.item].c+=r.p*r.qty});return m};
const tbl=m=>Object.keys(m).length?`<table><tr><th>الصنف</th><th>العدد</th><th>التكلفة</th></tr>${Object.keys(m).map(k=>`<tr><td>${esc(iname(k))}</td><td>${m[k].q}</td><td>${money(m[k].c)}</td></tr>`).join('')}</table>`:'<p class="mut s">مفيش بيانات معتمدة.</p>';
const b=by('break'),i=by('issue'),tot=o=>Object.values(o).reduce((s,x)=>s+x.c,0);
const last={};ap.filter(r=>r.op==='count').sort((a,b)=>a.ts-b.ts).forEach(r=>last[r.item]=r);
return `<div class="card"><label>الشهر</label><input type="month" value="${rmo}" onchange="rmo=this.value||rmo;render()"><button class="pri" onclick="exportXlsx()">تحميل تقرير Excel</button></div><div class="card"><b>إجمالي تكلفة الكسر: ${money(tot(b))}</b>${tbl(b)}</div><div class="card"><b>إجمالي المصروف: ${money(tot(i))}</b>${tbl(i)}</div>
<div class="card"><b>آخر جرد معتمد</b>${Object.keys(last).length?`<table>${Object.values(last).map(r=>`<tr><td>${esc(iname(r.item))}</td><td>${r.qty}</td><td class="mut s">${fmt(r.ts)}</td></tr>`).join('')}</table>`:'<p class="mut s">مفيش جرد معتمد.</p>'}</div>
<div class="card"><b>كل التسجيلات</b></div>`+mr.sort((a,b)=>b.ts-a.ts).slice(0,40).map(r=>recCard(r,false)).join('')},
new(){const its=S.items.filter(i=>i.hotel===me.hotel);
if(!its.length)return '<p class="mut">المدير لسه ما ضافش أصناف.</p>';
return `<div class="card"><label>نوع العملية</label><select id="op">${me.ops.map(o=>`<option value="${o}">${OPS[o]}</option>`).join('')}</select>
<label>الصنف</label><div class="row" style="flex-wrap:nowrap"><input id="it" list="dl" placeholder="اكتب أو امسح QR"><button class="sm" style="margin-bottom:10px;white-space:nowrap" onclick="scan()">مسح QR</button></div>
<datalist id="dl">${its.map(i=>`<option value="${esc(i.name)}">`).join('')}</datalist>
<label>العدد</label><input id="qty" type="number" inputmode="numeric" min="0">
<label>القسم</label><select id="ar">${SECS.map(s=>`<option>${s}</option>`).join('')}</select>
<label>سبب الكسر (للكسر فقط)</label><select id="rs">${REASONS.map(s=>`<option>${s}</option>`).join('')}</select>
${((S.hotels.find(h=>h.id===me.hotel)||{}).fields||[]).map(f=>`<label>${esc(f.name)}</label><input id="x_${f.id}" ${f.type==='number'?'type="number" inputmode="decimal"':''}>`).join('')}<label>صورة (اختياري)</label><input type="file" accept="image/*" capture="environment" onchange="getPhoto(this)">
<button class="pri" onclick="sendRec()">إرسال للمدير</button></div>`},
mine2(){}
};
VIEWS.hotEdit=()=>{const h=S.hotels.find(x=>x.id===eh);if(!h){eh=null;return VIEWS.hot()}
const us=S.users.filter(u=>u.hotel===h.id);
return `<button class="sm" style="margin-bottom:12px" onclick="eh=null;render()">رجوع</button>
<div class="card"><b>${esc(h.name)}</b><label>اسم الفندق</label><input id="en" value="${esc(h.name)}">
<label>لون التطبيق</label><input id="ec" type="color" value="${h.color||'#0e7c86'}" style="height:48px;padding:4px">
<label>الشعار</label>${h.logo?`<img class="th" src="${h.logo}" alt="" style="margin-bottom:10px">`:''}<input type="file" accept="image/*" onchange="getLogo(this)">
<button class="pri" onclick="saveHotel()">حفظ</button></div>
<div class="card"><b>تغيير كلمة سر</b><label>المستخدم</label><select id="ru">${us.map(u=>`<option value="${u.id}">${esc(u.name)} (${u.role==='manager'?'مدير':'كابتن'})</option>`).join('')}</select><input id="rp" placeholder="كلمة السر الجديدة"><button class="pri" onclick="resetPw()">تغيير</button></div>
<div class="card"><b>المستخدمين</b>${us.map(u=>`<div class="row" style="margin-top:8px"><span class="sp">${esc(u.name)} (${u.role==='manager'?'مدير':'كابتن'})</span><button class="sm bad" onclick="delUser('${u.id}')">حذف</button></div>`).join('')||'<p class="mut s">مفيش مستخدمين.</p>'}</div><div class="card"><b>خانات إضافية في تسجيل الكابتن</b><label>اسم الخانة</label><input id="fn"><label>النوع</label><select id="ft"><option value="text">نص</option><option value="number">رقم</option></select><button class="pri" onclick="addField()">إضافة الخانة</button>${(h.fields||[]).map(f=>`<div class="row" style="margin-top:8px"><span class="sp">${esc(f.name)} (${f.type==='number'?'رقم':'نص'})</span><button class="sm bad" onclick="delField('${f.id}')">حذف</button></div>`).join('')}</div>`};
VIEWS.mine=()=>{const r=S.recs.filter(r=>r.uid===me.id).sort((a,b)=>b.ts-a.ts);return r.length?r.map(x=>recCard(x,false)).join(''):'<p class="mut">لسه ما سجلتش حاجة.</p>'};

function getPhoto(f){const file=f.files[0];if(!file)return;const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,480/Math.max(img.width,img.height));c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);photo=c.toDataURL('image/jpeg',.6);URL.revokeObjectURL(img.src)};img.src=URL.createObjectURL(file)}
async function scan(cb){cb=cb||itemScan;
  if(!('BarcodeDetector' in window)||!navigator.mediaDevices)return photoScan(cb);
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}catch(e){return photoScan(cb)}
  const v=$('#vid');v.srcObject=stream;await v.play();$('#cam').style.display='flex';
  const d=new BarcodeDetector({formats:['qr_code']});
  scanT=setInterval(async()=>{try{const r=await d.detect(v);if(r.length){stopScan();cb(r[0].rawValue)}}catch(e){}},300)}
function stopScan(){clearInterval(scanT);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('#cam').style.display='none'}
function photoScan(cb){if(typeof jsQR==='undefined')return toast('المسح غير متاح، تأكد من النت');
 const f=document.createElement('input');f.type='file';f.accept='image/*';f.capture='environment';
 f.onchange=()=>{const file=f.files[0];if(!file)return;const img=new Image();img.onload=()=>{const k=Math.min(1,900/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);const d=x.getImageData(0,0,c.width,c.height);const r=jsQR(d.data,d.width,d.height);URL.revokeObjectURL(img.src);r?cb(r.data):toast('مقدرتش أقرأ الكود، صوّره أقرب وأوضح')};img.src=URL.createObjectURL(file)};f.click()}
function applyTheme(h){const r=document.documentElement.style;if(h&&h.color)r.setProperty('--ac',h.color);else r.removeProperty('--ac')}
function itemScan(c){const it=S.items.find(i=>i.hotel===me.hotel&&i.name===c);$('#it').value=it?it.name:c;if(!it)toast('الصنف غير مسجل')}
render();
</script><script type="module">
import {initializeApp,getApps} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,onAuthStateChanged,updatePassword} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,getDocs,setDoc,updateDoc,deleteDoc,addDoc,query,where,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const cfg={apiKey:"AIzaSyCdn8NTp8fFRs9HVZeYSEErYusZlEKscJ4",authDomain:"hotel-jard.firebaseapp.com",projectId:"hotel-jard",storageBucket:"hotel-jard.firebasestorage.app",messagingSenderId:"983220168110",appId:"1:983220168110:web:4412ed4a19f15d4ef2d43f"};
const OWNER="abdullahakousha2005@gmail.com";
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
const rid=()=>Math.random().toString(36).slice(2,10);
const H=s=>{s=s.trim().toLowerCase();let a=0xdeadbeef,b=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return (4294967296*(2097151&b)+(a>>>0)).toString(36)};
const soft=()=>{if(!/INPUT|SELECT/.test((document.activeElement||{}).tagName))render()};
let unsubs=[];
const stopSubs=()=>{unsubs.forEach(u=>u());unsubs=[]};
const sub=(q,k)=>unsubs.push(onSnapshot(q,s=>{S[k]=s.docs.map(d=>{const x=d.data();return {...x,id:k==='users'?(x.sid||d.id):d.id,_doc:d.id}});soft()},e=>console.error(k,e)));
function startSubs(){stopSubs();sub(collection(db,'hotels'),'hotels');
 if(me.role==='owner'){sub(collection(db,'users'),'users');return}
 const h=me.hotel,w=(c,...x)=>query(collection(db,c),where('hotel','==',h),...x);
 sub(w('items'),'items');
 if(me.role==='manager'){sub(w('users'),'users');sub(w('recs'),'recs')}else sub(w('recs',where('uid','==',me.id)),'recs')}
onAuthStateChanged(auth,async u=>{
 if(!u){me=null;stopSubs();S.users=[];S.items=[];S.recs=[];return render()}
 try{
  if(u.email===OWNER)me={role:'owner',name:'Abdullah',id:u.uid};
  else{const d=await getDoc(doc(db,'users',u.uid));if(!d.exists()){toast('الحساب غير موجود');return signOut(auth)}
   const h=await getDoc(doc(db,'hotels',d.data().hotel));if(!h.exists()||!h.data().active){toast('اشتراك الفندق موقوف');return signOut(auth)}
   me={...d.data(),id:d.data().sid||u.uid}}
  tab='';startSubs();render()}catch(e){toast('تعذر الدخول');signOut(auth)}});
const logout=()=>{lh=null;eh=null;signOut(auth)};
async function nextStep(){const n=val('hn2').trim().toLowerCase();if(!n)return toast('اكتب اسم الفندق');if(n==='abdullah'){lh='owner';return render()}
 try{const s=await getDocs(query(collection(db,'hotels'),where('nameKey','==',n)));if(s.empty)return toast('الفندق غير موجود');const d=s.docs[0];if(!d.data().active)return toast('اشتراك الفندق موقوف');lh={...d.data(),id:d.id};render()}catch(e){toast('تأكد من الاتصال بالنت')}}
async function signIn(h,u,p){const x=H(u),l=await getDoc(doc(db,'logins',h+'_'+x));if(!l.exists())throw 0;await signInWithEmailAndPassword(auth,`${x}.${l.data().ver}@${h}.jard.app`,p)}
async function login(){const p=val('p');try{if(lh==='owner')await signInWithEmailAndPassword(auth,OWNER,p);else await signIn(lh.id,val('u'),p)}catch(e){toast('بيانات الدخول غلط')}}
async function loginQR(c){const t=String(c).split(':');if(t[0]!=='JARD'||t.length<4)return toast('كود الدخول غير صحيح');try{await signIn(t[1],t[2],t.slice(3).join(':'))}catch(e){toast('كود الدخول غير صحيح')}}
async function mkUser(h,d,ver){const x=H(d.user);
 if(!d.sid&&(await getDoc(doc(db,'logins',h+'_'+x))).exists())throw new Error('dup');
 ver=Date.now().toString(36);const sa=getAuth(getApps().find(a=>a.name==='sec')||initializeApp(cfg,'sec'));
 const c=await createUserWithEmailAndPassword(sa,`${x}.${ver}@${h}.jard.app`,d.pw);await signOut(sa);
 await setDoc(doc(db,'users',c.user.uid),{...d,sid:d.sid||c.user.uid,hotel:h,ver});await setDoc(doc(db,'logins',h+'_'+x),{ver})}
async function addHotel(){const n=val('hn').trim(),mn=val('mn').trim(),u=val('mu').trim(),p=val('mp');
 if(!n||!mn||!u||p.length<6||u.includes(':'))return toast('اكمل البيانات (كلمة السر 6 حروف أو أكتر)');
 const h=rid();try{await setDoc(doc(db,'hotels',h),{name:n,nameKey:n.toLowerCase(),active:true});await mkUser(h,{role:'manager',name:mn,user:u,pw:p,ops:['break','count','issue']});toast('تمت الإضافة')}catch(e){toast('تعذرت الإضافة، جرب اسم دخول تاني')}}
async function addStaff(){const n=val('sn').trim(),e=val('se').trim(),u=val('su').trim(),p=val('sp');const ops=['break','count','issue'].filter(k=>$('#o_'+k).checked);
 if(!n||!e||!u||p.length<6||!ops.length||u.includes(':'))return toast('اكمل البيانات (كلمة السر 6 حروف أو أكتر)');
 try{await mkUser(me.hotel,{role:'captain',name:n,emp:e,user:u,pw:p,ops});toast('تمت الإضافة');render()}catch(x){toast('اسم الدخول مستخدم')}}
async function setPw(sid,p){const u=S.users.find(x=>x.id===sid);if(!u||!p||p.length<6)return toast('كلمة السر 6 حروف أو أكتر');
 try{const {_doc,id,hotel,ver,...d}=u;await mkUser(hotel,{...d,pw:p,sid});await deleteDoc(doc(db,'users',_doc));toast('تم تغيير كلمة السر')}catch(e){toast('تعذر التغيير')}}
const staffPw=id=>{const u=S.users.find(x=>x.id===id);if(u)setPw(id,prompt('كلمة السر الجديدة لـ '+u.name))};
const resetPw=()=>setPw(val('ru'),val('rp'));
async function delStaff(id){if(!confirm('حذف الكابتن؟'))return;const u=S.users.find(x=>x.id===id);await deleteDoc(doc(db,'users',u._doc));await deleteDoc(doc(db,'logins',u.hotel+'_'+H(u.user)))}
async function addItem(){const n=val('in').trim(),p=parseFloat(val('ip'));if(!n||isNaN(p))return toast('اكتب الاسم والسعر');await addDoc(collection(db,'items'),{hotel:me.hotel,name:n,price:p,sec:val('is')});render()}
async function editPrice(id){const i=S.items.find(i=>i.id===id),p=parseFloat(prompt('السعر الجديد',i.price));if(!isNaN(p))await updateDoc(doc(db,'items',id),{price:p})}
async function delItem(id){if(confirm('حذف الصنف؟'))await deleteDoc(doc(db,'items',id))}
async function setSt(id,s){await updateDoc(doc(db,'recs',id),{status:s})}
async function togH(id){const h=S.hotels.find(h=>h.id===id);await updateDoc(doc(db,'hotels',id),{active:!h.active})}
async function saveHotel(){const n=val('en').trim();if(!n)return toast('اكتب اسم الفندق');await updateDoc(doc(db,'hotels',eh),{name:n,nameKey:n.toLowerCase(),color:val('ec')});toast('تم الحفظ')}
function getLogo(f){const file=f.files[0];if(!file||!eh)return;const img=new Image();img.onload=async()=>{const k=Math.min(1,240/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);const n=val('en').trim();URL.revokeObjectURL(img.src);await updateDoc(doc(db,'hotels',eh),{logo:c.toDataURL('image/png'),...(n?{name:n,nameKey:n.toLowerCase()}:{}),color:val('ec')})};img.src=URL.createObjectURL(file)}
async function addField(){const h=S.hotels.find(x=>x.id===eh),n=val('fn').trim();if(!n)return toast('اكتب اسم الخانة');await updateDoc(doc(db,'hotels',eh),{fields:[...(h.fields||[]),{id:rid(),name:n,type:val('ft')}]})}
async function delField(id){const h=S.hotels.find(x=>x.id===eh);await updateDoc(doc(db,'hotels',eh),{fields:(h.fields||[]).filter(f=>f.id!==id)})}
async function sendRec(){const op=val('op'),q=val('it').trim(),n=parseInt(val('qty'),10);
 const it=S.items.find(i=>i.name===q);if(!it)return toast('اختار صنف من القايمة');
 if(isNaN(n)||n<0||(n===0&&op!=='count'))return toast('اكتب العدد');
 const ex={};((S.hotels.find(h=>h.id===me.hotel)||{}).fields||[]).forEach(f=>{const v=val('x_'+f.id).trim();if(v)ex[f.name]=v});
 try{await addDoc(collection(db,'recs'),{hotel:me.hotel,uid:me.id,un:me.name,ue:me.emp||'',op,item:it.id,qty:n,p:it.price,area:val('ar'),reason:op==='break'?val('rs'):'',ex,photo,ts:Date.now(),status:'pending'});photo='';toast('تم الإرسال للمدير');render()}catch(e){toast('تعذر الإرسال، تأكد من النت')}}
async function chgOwner(){const p=prompt('كلمة السر الجديدة (6 حروف أو أكتر)');if(!p)return;if(p.length<6)return toast('6 حروف على الأقل');try{await updatePassword(auth.currentUser,p);toast('تم التغيير')}catch(e){toast('اعمل خروج ودخول تاني وجرب')}}
function showQR(id){const u=S.users.find(x=>x.id===id);if(!u)return;if(typeof qrcode==='undefined')return toast('مكتبة QR لم تحمّل، تأكد من النت');
 qrcode.stringToBytes=qrcode.stringToBytesFuncs['UTF-8'];const q=qrcode(0,'M');q.addData(`JARD:${u.hotel}:${u.user}:${u.pw}`);q.make();
 $('#qrbox').innerHTML=`<div class="card" style="text-align:center"><b>${esc(u.name)}</b><div style="background:#fff;padding:12px;display:inline-block;margin:10px">${q.createSvgTag(5,0)}</div><p class="mut s">الكود ده فيه بيانات دخول الكابتن، اديه له هو بس.</p><div class="row"><button class="sm sp" onclick="staffPw('${id}')">تغيير كلمة السر</button><button class="sm sp" onclick="$('#qrbox').innerHTML=''">إغلاق</button></div></div>`}
function exportXlsx(){if(typeof XLSX==='undefined')return toast('مكتبة Excel لم تحمّل، تأكد من النت');
 const rs=S.recs.filter(r=>r.hotel===me.hotel&&inMo(r)).sort((a,b)=>a.ts-b.ts);
 if(!rs.length)return toast('مفيش تسجيلات في الشهر ده');
 const h=S.hotels.find(x=>x.id===me.hotel)||{},fl=(h.fields||[]).map(f=>f.name);
 const rows=rs.map(r=>{const u=S.users.find(x=>x.id===r.uid)||{name:r.un,emp:r.ue};const o={'التاريخ':fmt(r.ts),'العملية':OPS[r.op],'الصنف':iname(r.item),'العدد':r.qty,'السعر':r.p,'الإجمالي':r.op==='count'?'':r.p*r.qty,'السبب':r.reason||'','القسم':r.area||'','الموظف':u.name||'','الرقم الوظيفي':u.emp||'','الحالة':STAT[r.status]};fl.forEach(k=>o[k]=(r.ex||{})[k]||'');return o});
 const sum={};rs.filter(r=>r.status==='approved'&&r.op!=='count').forEach(r=>{const k=r.op+'|'+r.item;const x=sum[k]=sum[k]||{'العملية':OPS[r.op],'الصنف':iname(r.item),'العدد':0,'التكلفة':0};x['العدد']+=r.qty;x['التكلفة']+=r.p*r.qty});
 const wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:true}]};
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'التسجيلات');
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(Object.values(sum)),'ملخص المعتمد');
 XLSX.writeFile(wb,`جرد-${h.name||'فندق'}-${rmo}.xlsx`)}
async function delUser(id){const u=S.users.find(x=>x.id===id);if(!u||!confirm('حذف '+u.name+'؟ مش هيقدر يدخل تاني.'))return;await deleteDoc(doc(db,'users',u._doc));await deleteDoc(doc(db,'logins',u.hotel+'_'+H(u.user)));toast('تم الحذف')}
Object.assign(window,{logout,nextStep,login,loginQR,addHotel,addStaff,staffPw,resetPw,delStaff,addItem,editPrice,delItem,setSt,togH,saveHotel,getLogo,addField,delField,sendRec,chgOwner,showQR,exportXlsx,delUser});
</script>
